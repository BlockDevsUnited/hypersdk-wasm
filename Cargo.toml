[workspace]
resolver = "2"
members = [
  "x/contracts/sdk-macros",
  "x/contracts/wasmlanche",
  "x/contracts/examples/token",
  "x/contracts/examples/counter",
  "x/contracts/examples/counter-external",
  "x/contracts/examples/automated-market-maker",
  "x/contracts/wasmlanche/tests/test-crate",
  "x/contracts/wasmlanche/tests/bench-crate",
  "x/contracts/test/contracts/async_consumer",
  "x/contracts/test/contracts/async_producer",
  "x/contracts/test/contracts/async_producer_fixed",
  "x/contracts/test/contracts/async_test",
  "x/contracts/test/contracts/balance",
  "x/contracts/test/contracts/call_contract",
  "x/contracts/test/contracts/deploy_contract",
  "x/contracts/test/contracts/failing_test",
  "x/contracts/test/contracts/fuel",
  "x/contracts/test/contracts/resource_test",
  "x/contracts/test/contracts/return_complex_type",
  "x/contracts/test/contracts/return_complex_type_async",
  "x/contracts/test/contracts/return_complex_type_test",
  "x/contracts/test/contracts/simple",
  "x/contracts/test/contracts/simple2",
  "x/contracts/test/contracts/state_access",
  "x/contracts/test/contracts/state_test",
  "x/contracts/simulator",
  "x/contracts/examples/tutorial",
  "x/contracts/examples/nft",
  "x/contracts/examples/multisig",
  "x/contracts/wasmlanche/wasmlanche-test",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
overflow-checks = true
panic = 'abort'
strip = true

[profile.wasm]
inherits = "release"
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'

[profile.wasm.build-override]
opt-level = 's'
codegen-units = 1

[workspace.dependencies]
wasmlanche = { path = "x/contracts/wasmlanche", default-features = false }
sdk-macros = { path = "x/contracts/sdk-macros" }
simulator = { path = "x/contracts/simulator", default-features = false }
thiserror = "1.0"
