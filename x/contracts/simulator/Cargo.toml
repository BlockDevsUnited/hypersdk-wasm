[package]
name = "simulator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
borsh = { version = "0.10.3", features = ["std"] }
thiserror = "1.0"
async-trait = "0.1"
futures = { version = "0.3", features = ["executor"] }
tokio = { version = "1.36.0", features = ["full"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "25.0.3", features = ["async", "cranelift"] }

[build-dependencies]
bindgen = "0.69.4"
serde_json = "1.0"

[dev-dependencies]
wasmlanche = { path = "../wasmlanche", features = ["std"] }

[features]
default = ["std"]
std = []

[package.metadata.docs.rs]
all-features = true
