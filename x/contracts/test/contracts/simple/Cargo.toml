[package]
name = "simple"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
bindings = ["wasmlanche/bindings"]
test = ["wasmlanche/test"]

[dependencies]
wasmlanche = { path = "../../../wasmlanche" }
sdk-macros = { path = "../../../sdk-macros" }

[dev-dependencies]
wasmlanche = { workspace = true, features = ["debug", "test"] }

[build-dependencies]
wasmlanche = { workspace = true, features = ["build"] }
