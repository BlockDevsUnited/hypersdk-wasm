[package]
name = "counter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
std = ["wasmlanche/std"]
test = ["std", "wasmlanche/test"]
bindings = ["wasmlanche/bindings"]

[dependencies]
wasmlanche = { path = "../../wasmlanche", default-features = false }

[dev-dependencies]
wasmlanche = { path = "../../wasmlanche", features = ["std", "test"] }

[build-dependencies]
wasmlanche-build = { path = "../../wasmlanche-build" }
