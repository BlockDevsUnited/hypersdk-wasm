[package]
name = "wasmlanche"
version = "0.1.0"
edition = "2021"

[dependencies]
borsh = { version = "0.10", default-features = false }
bytemuck = { version = "1.17.0", features = ["derive"] }
cfg-if = "1.0.0"
displaydoc = "0.2"
hashbrown = "0.14.5"
hex = "0.4"
parking_lot = "0.12.1"
sdk-macros = { workspace = true }
spin = "0.9.8"
sha2 = { version = "0.10", default-features = false }
sha3 = { version = "0.10", default-features = false }
curve25519-dalek = { version = "3.2", default-features = false, features = ["u64_backend"] }
futures = { version = "0.3", default-features = false, features = ["executor"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
simulator = { path = "../simulator", features = ["std"] }
wasmtime = { version = "15.0.1", features = ["async"] }
tokio = { version = "1.0", features = ["sync", "rt", "macros"] }
thiserror = "1.0"
async-trait = "0.1"
ed25519-dalek = { version = "1.0", default-features = false, features = ["u64_backend", "std"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wee_alloc = "0.4"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
env_logger = "0.11.5"
tokio = { version = "1.0", features = ["full"] }
test-log = "0.2.14"
test-crate = { path = "tests/test-crate" }

[features]
default = ["std"]
std = [
    "borsh/std",
    "sha2/std",
    "sha3/std",
    "curve25519-dalek/std",
    "futures/std"
]
wasm = []
bindings = ["std"]
test = ["std"]
debug = ["std"]
build = ["std"]

[package.metadata.docs.rs]
all-features = true

[[bench]]
name = "call_contract_time"
harness = false

[[bench]]
name = "call_contract_mem"
harness = false
